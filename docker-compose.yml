services:
  backend:
    build: ./backend
    ports:
      - "4000:4000"
    volumes:
      - ./backend/public:/app/public
      - ./backend/uploads:/app/uploads
    env_file:
      - ./backend/.env

  frontend:
    build: ./frontend/cuely
    ports:
      - "3001:3000"
    environment:
      - BACKEND_URL=http://backend:4000
    depends_on:
      - backend
